services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trademark
      POSTGRES_PASSWORD: trademark
      POSTGRES_DB: trademark
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trademark -d trademark"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://trademark:trademark@postgres:5432/trademark?sslmode=disable
      HTTP_LISTEN_ADDR: ":8080"
      LOG_LEVEL: debug
      APP_ENV: development
      JWT_ACCESS_SECRET: dev-access-secret-replace-me
      JWT_REFRESH_SECRET: dev-refresh-secret-replace-me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: change-me-on-first-login
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
